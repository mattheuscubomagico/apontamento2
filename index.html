<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apontamentos de Obra</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#eef4fb;
    color:#172033;
    font-family:Arial,Helvetica,sans-serif;
}

.app{
    max-width:560px;
    margin:auto;
    min-height:100vh;
    background:#f8fbff;
}

header{
    background:#172033;
    color:white;
    padding:22px 20px;
    font-size:23px;
    font-weight:800;
}

nav{
    display:flex;
    gap:7px;
    padding:10px;
    background:white;
    position:sticky;
    top:0;
    z-index:10;
    border-bottom:1px solid #dce5ef;
}

nav button{
    flex:1;
    border:0;
    border-radius:10px;
    padding:12px 5px;
    font-weight:800;
    background:#e5ecf4;
    color:#172033;
}

nav button.active{
    background:#172033;
    color:white;
}

.page{
    padding:16px;
}

.hidden{
    display:none!important;
}

.card{
    background:white;
    border:1px solid #dce5ef;
    border-radius:18px;
    padding:17px;
    margin-bottom:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.05);
}

h2{
    margin:0 0 6px;
    font-size:25px;
}

h3{
    margin:0 0 12px;
}

.subtitle{
    color:#64748b;
}

label{
    display:block;
    font-size:13px;
    font-weight:800;
    margin:13px 0 6px;
}

input,
select{
    width:100%;
    padding:13px;
    border:1px solid #b8c5d4;
    border-radius:10px;
    background:white;
    color:#172033;
    font-size:16px;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:11px;
    font-size:16px;
    font-weight:800;
    margin-top:10px;
    cursor:pointer;
}

.green{
    background:#198754;
    color:white;
}

.dark{
    background:#172033;
    color:white;
}

.gray{
    background:#e5ecf4;
    color:#172033;
}

.red{
    background:#fee2e2;
    color:#991b1b;
}

.orange{
    background:#fff1dc;
    color:#8a4b00;
}

.small{
    color:#64748b;
    font-size:13px;
}

.entry{
    border:1px solid #dce5ef;
    border-radius:13px;
    padding:13px;
    margin:9px 0;
    background:#fbfdff;
}

.entry-title{
    font-weight:800;
    margin-bottom:7px;
}

.tag{
    display:inline-block;
    background:#e8eef6;
    border-radius:20px;
    padding:5px 9px;
    font-size:12px;
    font-weight:700;
    margin:3px 2px;
}

.preview{
    white-space:pre-wrap;
    background:#f8fafc;
    border:1px solid #dce5ef;
    border-radius:12px;
    padding:14px;
    line-height:1.55;
    font-size:14px;
}

.success{
    color:#198754;
    font-weight:800;
}

.info{
    background:#eef6ff;
    border:1px solid #cfe3f8;
    padding:12px;
    border-radius:12px;
    margin-top:12px;
}

.summary{
    background:#f5f7fa;
    border-radius:12px;
    padding:13px;
    margin-top:12px;
}

</style>
</head>

<body>

<div class="app">

<header>
    🏗️ Apontamentos de Obra
</header>

<nav>

<button id="navNovo"
        class="active"
        onclick="mostrarPagina('novo')">
    Novo
</button>

<button id="navHistorico"
        onclick="mostrarPagina('historico')">
    Histórico
</button>

<button id="navRelatorio"
        onclick="mostrarPagina('relatorio')">
    Relatório
</button>

</nav>


<!-- =====================================================
     NOVO APONTAMENTO
===================================================== -->

<section id="paginaNovo" class="page">

<div class="card">

<h2 id="tituloFormulario">
    Novo apontamento
</h2>

<p class="subtitle">
    Registre a aplicação diretamente no trecho.
</p>


<label>Data</label>

<input
    id="data"
    type="date"
>


<label>Tipo de apontamento</label>

<select
    id="tipo"
    onchange="alterarTipo()"
>

<option value="CBUQ">
    CBUQ
</option>

<option value="Terraplenagem">
    Terraplenagem
</option>

<option value="TSD">
    TSD
</option>

<option value="Sub-Base">
    Sub-Base
</option>

<option value="Base">
    Base
</option>

<option value="Drenagem">
    Drenagem
</option>

<option value="Imprimação">
    Imprimação
</option>

</select>


<div class="row">

<div>

<label>Km Inicial</label>

<input
    id="kmInicial"
    placeholder="805+700"
>

</div>


<div>

<label>Km Final</label>

<input
    id="kmFinal"
    placeholder="806+500"
>

</div>

</div>


<label>Sentido</label>

<select id="sentido">

<option>Norte</option>
<option>Sul</option>
<option>Leste</option>
<option>Oeste</option>
<option>Centro</option>
<option>Ambos os sentidos</option>
<option>Outro</option>

</select>


<!-- CAMADA -->

<div id="campoCamada">

<label>Camada</label>

<select id="camada">

<option>1ª camada</option>
<option>2ª camada</option>
<option>3ª camada</option>
<option>4ª camada</option>
<option>5ª camada</option>

</select>

</div>


<!-- LOCAL -->

<label>Faixa / Local</label>

<select
    id="faixa"
    onchange="alterarFaixa()"
>

<option>Faixa 1</option>

<option>Faixa 2</option>

<option>Acostamento</option>

<option>Faixa de Aceleração</option>

<option>Faixa de Desaceleração</option>

<option>Alça de Acesso</option>

<option>Alça de Retorno</option>

<option>Outro</option>

</select>


<label>Largura (m)</label>

<input
    id="largura"
    type="number"
    step="0.01"
>


<div
    id="infoLargura"
    class="small"
>
</div>


<!-- ALTURA -->

<div id="campoAltura">

<label id="labelAltura">
    Espessura / Altura (m)
</label>

<input
    id="altura"
    type="number"
    step="0.001"
    value="0.05"
>

</div>


<!-- DENSIDADE -->

<div id="campoDensidade">

<label>
    Densidade (t/m³)
</label>

<input
    id="densidade"
    type="number"
    step="0.001"
    value="2.362"
>

</div>


<div
    id="informacaoFormula"
    class="info"
>
</div>


<button
    id="botaoSalvar"
    class="button green"
    onclick="salvarApontamento()"
>
💾 Salvar apontamento
</button>


<button
    id="botaoCancelar"
    class="button gray hidden"
    onclick="cancelarEdicao()"
>
Cancelar edição
</button>

</div>


<!-- APONTAMENTOS DO DIA -->

<div
    id="cardHoje"
    class="card hidden"
>

<h3>
    Apontamentos desta data
</h3>

<div id="listaHoje"></div>

<button
    class="button dark"
    onclick="abrirRelatorioDoDia()"
>
📋 Ver relatório do dia
</button>

</div>

</section>


<!-- =====================================================
     HISTÓRICO
===================================================== -->

<section
    id="paginaHistorico"
    class="page hidden"
>

<div class="card">

<h2>
    Histórico
</h2>

<p class="subtitle">
    Consulte, edite ou exclua seus apontamentos.
</p>


<label>
    Filtrar por data
</label>

<input
    id="filtroHistorico"
    type="date"
    onchange="mostrarHistorico()"
>


<button
    class="button gray"
    onclick="limparFiltroHistorico()"
>
Mostrar todos
</button>

</div>


<div id="listaHistorico"></div>

</section>


<!-- =====================================================
     RELATÓRIO
===================================================== -->

<section
    id="paginaRelatorio"
    class="page hidden"
>

<div class="card">

<h2>
    Relatório
</h2>

<p class="subtitle">
    Todos os apontamentos do dia em uma única mensagem.
</p>


<label>
    Data
</label>

<input
    id="dataRelatorio"
    type="date"
    onchange="gerarRelatorio()"
>


<button
    class="button gray"
    onclick="relatorioHoje()"
>
Hoje
</button>

</div>


<div class="card">

<div
    id="relatorioPreview"
    class="preview"
>
Nenhum apontamento encontrado.
</div>


<button
    class="button green"
    onclick="copiarRelatorio()"
>
📋 Copiar relatório
</button>


<button
    class="button dark"
    onclick="enviarWhatsApp()"
>
💬 Enviar tudo pelo WhatsApp
</button>

</div>

</section>

</div>


<script>

/* =====================================================
   BANCO LOCAL
===================================================== */

const CHAVE = "APONTAMENTOS_OBRA_V5";

let idEditando = null;

let textoRelatorio = "";


/* =====================================================
   DATA
===================================================== */

function hoje(){

    const d = new Date();

    return d.getFullYear()
        + "-"
        + String(d.getMonth()+1).padStart(2,"0")
        + "-"
        + String(d.getDate()).padStart(2,"0");

}


function dataBR(data){

    if(!data) return "";

    return data
        .split("-")
        .reverse()
        .join("/");

}


/* =====================================================
   BANCO
===================================================== */

function obterApontamentos(){

    return JSON.parse(
        localStorage.getItem(CHAVE) || "[]"
    );

}


function salvarBanco(lista){

    localStorage.setItem(
        CHAVE,
        JSON.stringify(lista)
    );

}


/* =====================================================
   FORMATAÇÃO
===================================================== */

function numero(valor, casas=3){

    return Number(valor).toLocaleString(
        "pt-BR",
        {
            minimumFractionDigits:casas,
            maximumFractionDigits:casas
        }
    );

}


/* =====================================================
   KM
===================================================== */

function converterKm(valor){

    valor = String(valor)
        .replace(",",".")
        .trim();

    const partes = valor.split("+");

    if(partes.length === 2){

        const km = parseFloat(partes[0]);

        const metros = parseFloat(partes[1]);

        if(!isNaN(km) && !isNaN(metros)){

            return km * 1000 + metros;

        }

    }

    return parseFloat(valor);

}


/* =====================================================
   CONFIGURAÇÃO
===================================================== */

function alterarTipo(){

    const tipo =
        document.getElementById("tipo").value;


    const campoCamada =
        document.getElementById("campoCamada");

    const campoAltura =
        document.getElementById("campoAltura");

    const campoDensidade =
        document.getElementById("campoDensidade");

    const labelAltura =
        document.getElementById("labelAltura");


    campoCamada.classList.remove("hidden");

    campoAltura.classList.remove("hidden");

    campoDensidade.classList.add("hidden");


    if(tipo === "CBUQ"){

        campoDensidade.classList.remove("hidden");

        labelAltura.innerText =
            "Espessura (m)";

        document.getElementById("altura").value =
            "0.05";

        document.getElementById("densidade").value =
            "2.362";

    }


    else if(
        tipo === "TSD" ||
        tipo === "Imprimação"
    ){

        campoAltura.classList.add("hidden");

        campoCamada.classList.add("hidden");

    }


    else if(tipo === "Drenagem"){

        labelAltura.innerText =
            "Altura / Profundidade (m)";

    }


    else{

        labelAltura.innerText =
            "Altura / Espessura (m)";

    }


    atualizarFormula();

}


function alterarFaixa(){

    const faixa =
        document.getElementById("faixa").value;

    const largura =
        document.getElementById("largura");


    const larguras = {

        "Faixa 1":4.10,

        "Faixa 2":3.70,

        "Acostamento":2.50,

        "Faixa de Aceleração":3.50,

        "Faixa de Desaceleração":3.50,

        "Alça de Acesso":3.50

    };


    if(larguras[faixa] !== undefined){

        largura.value =
            larguras[faixa];

        largura.readOnly = true;

        document.getElementById(
            "infoLargura"
        ).innerText =
            "Largura configurada: "
            + larguras[faixa]
            .toFixed(2)
            .replace(".",",")
            + " m";

    }

    else{

        largura.readOnly = false;

        document.getElementById(
            "infoLargura"
        ).innerText =
            "Largura variável — informe a largura.";

    }


    if(
        document.getElementById("tipo").value === "CBUQ"
    ){

        if(faixa === "Acostamento"){

            document.getElementById(
                "densidade"
            ).value = "2.355";

        }

        else{

            document.getElementById(
                "densidade"
            ).value = "2.362";

        }

    }


    atualizarFormula();

}


/* =====================================================
   FÓRMULA
===================================================== */

function atualizarFormula(){

    const tipo =
        document.getElementById("tipo").value;

    const info =
        document.getElementById("informacaoFormula");


    if(tipo === "CBUQ"){

        info.innerText =
            "CBUQ: Comprimento × Largura × Espessura × Densidade";

    }

    else if(tipo === "TSD"){

        info.innerText =
            "TSD: Comprimento × Largura = m²";

    }

    else if(tipo === "Imprimação"){

        info.innerText =
            "Imprimação: Comprimento × Largura = m²";

    }

    else if(tipo === "Terraplenagem"){

        info.innerText =
            "Terraplenagem: Comprimento × Largura × Altura = m³";

    }

    else if(tipo === "Sub-Base"){

        info.innerText =
            "Sub-Base: Comprimento × Largura × Altura = m³";

    }

    else if(tipo === "Base"){

        info.innerText =
            "Base: Comprimento × Largura × Altura = m³";

    }

    else if(tipo === "Drenagem"){

        info.innerText =
            "Drenagem: Comprimento × Largura × Altura = m³";

    }

}


/* =====================================================
   CALCULAR
===================================================== */

function calcularFormulario(){

    const kmInicial =
        document.getElementById("kmInicial").value;

    const kmFinal =
        document.getElementById("kmFinal").value;


    const inicio =
        converterKm(kmInicial);

    const fim =
        converterKm(kmFinal);


    if(
        isNaN(inicio) ||
        isNaN(fim) ||
        fim <= inicio
    ){

        alert(
            "Confira os Kms inicial e final."
        );

        return null;

    }


    const tipo =
        document.getElementById("tipo").value;

    const largura =
        parseFloat(
            document.getElementById("largura").value
        );


    if(
        isNaN(largura) ||
        largura <= 0
    ){

        alert("Informe a largura.");

        return null;

    }


    const comprimento =
        fim - inicio;


    let altura = 0;

    let densidade = 0;

    let quantidade = 0;

    let unidade = "";

    let calculo = "";


    /* CBUQ */

    if(tipo === "CBUQ"){

        altura =
            parseFloat(
                document.getElementById("altura").value
            );

        densidade =
            parseFloat(
                document.getElementById("densidade").value
            );


        if(
            isNaN(altura) ||
            isNaN(densidade)
        ){

            alert(
                "Confira a espessura e a densidade."
            );

            return null;

        }


        quantidade =
            comprimento *
            largura *
            altura *
            densidade;


        unidade = "ton";

        calculo =
            `${numero(comprimento)} × `
            + `${numero(largura,2)} × `
            + `${altura.toFixed(2)} × `
            + `${densidade.toFixed(3)}`;

    }


    /* TSD / IMPRIMAÇÃO */

    else if(
        tipo === "TSD" ||
        tipo === "Imprimação"
    ){

        quantidade =
            comprimento *
            largura;

        unidade = "m²";

        calculo =
            `${numero(comprimento)} × `
            + `${numero(largura,2)}`;

    }


    /* VOLUME */

    else{

        altura =
            parseFloat(
                document.getElementById("altura").value
            );


        if(
            isNaN(altura) ||
            altura <= 0
        ){

            alert(
                "Informe a altura/espessura."
            );

            return null;

        }


        quantidade =
            comprimento *
            largura *
            altura;

        unidade = "m³";

        calculo =
            `${numero(comprimento)} × `
            + `${numero(largura,2)} × `
            + `${altura.toFixed(2)}`;

    }


    return {

        id:
            idEditando ||
            Date.now(),

        data:
            document.getElementById("data").value,

        tipo,

        kmInicial,

        kmFinal,

        sentido:
            document.getElementById("sentido").value,

        camada:
            document.getElementById("camada").value,

        faixa:
            document.getElementById("faixa").value,

        comprimento,

        largura,

        altura,

        densidade,

        quantidade,

        unidade,

        calculo

    };

}


/* =====================================================
   SALVAR
===================================================== */

function salvarApontamento(){

    const apontamento =
        calcularFormulario();


    if(!apontamento)
        return;


    let lista =
        obterApontamentos();


    const indice =
        lista.findIndex(
            x => x.id === apontamento.id
        );


    if(indice >= 0){

        lista[indice] =
            apontamento;

        alert(
            "Apontamento atualizado! ✅"
        );

    }

    else{

        lista.push(
            apontamento
        );

        alert(
            "Apontamento salvo! ✅"
        );

    }


    salvarBanco(lista);


    idEditando = null;


    limparFormulario();


    mostrarApontamentosHoje();

}


/* =====================================================
   LIMPAR
===================================================== */

function limparFormulario(){

    document.getElementById(
        "tituloFormulario"
    ).innerText =
        "Novo apontamento";


    document.getElementById(
        "botaoSalvar"
    ).innerText =
        "💾 Salvar apontamento";


    document.getElementById(
        "botaoCancelar"
    ).classList.add("hidden");


    idEditando = null;


    document.getElementById(
        "kmInicial"
    ).value = "";

    document.getElementById(
        "kmFinal"
    ).value = "";


    document.getElementById(
        "data"
    ).value = hoje();


    document.getElementById(
        "tipo"
    ).value = "CBUQ";


    document.getElementById(
        "sentido"
    ).value = "Norte";


    document.getElementById(
        "camada"
    ).value = "1ª camada";


    document.getElementById(
        "faixa"
    ).value = "Faixa 1";


    document.getElementById(
        "altura"
    ).value = "0.05";


    document.getElementById(
        "densidade"
    ).value = "2.362";


    alterarTipo();

    alterarFaixa();

}


/* =====================================================
   EDITAR
===================================================== */

function editarApontamento(id){

    const lista =
        obterApontamentos();


    const x =
        lista.find(
            item => item.id === id
        );


    if(!x)
        return;


    idEditando = id;


    mostrarPagina("novo");


    document.getElementById(
        "tituloFormulario"
    ).innerText =
        "Editar apontamento";


    document.getElementById(
        "botaoSalvar"
    ).innerText =
        "💾 Salvar alterações";


    document.getElementById(
        "botaoCancelar"
    ).classList.remove("hidden");


    document.getElementById(
        "data"
    ).value =
        x.data;


    document.getElementById(
        "tipo"
    ).value =
        x.tipo;


    document.getElementById(
        "kmInicial"
    ).value =
        x.kmInicial;


    document.getElementById(
        "kmFinal"
    ).value =
        x.kmFinal;


    document.getElementById(
        "sentido"
    ).value =
        x.sentido;


    document.getElementById(
        "camada"
    ).value =
        x.camada;


    document.getElementById(
        "faixa"
    ).value =
        x.faixa;


    document.getElementById(
        "largura"
    ).value =
        x.largura;


    document.getElementById(
        "altura"
    ).value =
        x.altura;


    document.getElementById(
        "densidade"
    ).value =
        x.densidade;


    alterarTipo();

    document.getElementById(
        "largura"
    ).value =
        x.largura;

}


/* =====================================================
   CANCELAR EDIÇÃO
===================================================== */

function cancelarEdicao(){

    limparFormulario();

    mostrarApontamentosHoje();

}


/* =====================================================
   EXCLUIR
===================================================== */

function excluirApontamento(id){

    if(
        !confirm(
            "Tem certeza que deseja excluir este apontamento?"
        )
    )
        return;


    let lista =
        obterApontamentos()
        .filter(
            x => x.id !== id
        );


    salvarBanco(lista);


    mostrarHistorico();

    mostrarApontamentosHoje();

    gerarRelatorio();

}


/* =====================================================
   APONTAMENTOS DE HOJE
===================================================== */

function mostrarApontamentosHoje(){

    const dataAtual =
        document.getElementById(
            "data"
        ).value;


    const lista =
        obterApontamentos()
        .filter(
            x => x.data === dataAtual
        );


    const card =
        document.getElementById(
            "cardHoje"
        );


    if(lista.length === 0){

        card.classList.add("hidden");

        return;

    }


    card.classList.remove("hidden");


    document.getElementById(
        "listaHoje"
    ).innerHTML =

        lista.map(
            (x,index) => `

            <div class="entry">

                <div class="entry-title">

                    ${String(index+1).padStart(2,"0")}
                    —
                    ${x.tipo}
                    —
                    ${x.faixa}

                    ${
                        x.camada
                        ?
                        " — " + x.camada
                        :
                        ""
                    }

                </div>

                <span class="tag">
                    Sentido: ${x.sentido}
                </span>

                <span class="tag">
                    ${numero(x.quantidade)}
                    ${x.unidade}
                </span>

                <br>

                <button
                    class="button gray"
                    onclick="editarApontamento(${x.id})"
                >
                    ✏️ Editar
                </button>

            </div>

        `

        ).join("");

}


/* =====================================================
   RELATÓRIO
===================================================== */

function montarRelatorio(lista){

    if(lista.length === 0){

        return "Nenhum apontamento encontrado para esta data.";

    }


    let texto =

`APONTAMENTO DIÁRIO DE OBRA

Data: ${dataBR(lista[0].data)}
Quantidade de apontamentos: ${lista.length}

`;


    lista.forEach(
        (x,index) => {

            texto +=

`${String(index+1).padStart(2,"0")} — ${x.tipo} — ${x.faixa}`;

            if(x.camada){

                texto +=
                    ` — ${x.camada}`;

            }


            texto +=

`
Sentido: ${x.sentido}
Trecho: KM ${x.kmInicial} a KM ${x.kmFinal}
Comprimento: ${numero(x.comprimento)} m
Largura: ${numero(x.largura,2)} m
`;


            if(x.tipo === "CBUQ"){

                texto +=

`Espessura: ${x.altura.toFixed(2)} m
Densidade: ${x.densidade.toFixed(3)} t/m³
Cálculo: ${x.calculo}
Massa Aplicada: ${numero(x.quantidade)} ton

`;

            }


            else if(
                x.tipo === "TSD" ||
                x.tipo === "Imprimação"
            ){

                texto +=

`Cálculo: ${x.calculo}
Área Executada: ${numero(x.quantidade)} m²

`;

            }


            else{

                texto +=

`Altura: ${x.altura.toFixed(2)} m
Cálculo: ${x.calculo}
Volume Executado: ${numero(x.quantidade)} m³

`;

            }

        }

    );


    /* RESUMO */

    const comprimentoTotal =
        lista.reduce(
            (total,x) =>
                total + x.comprimento,
            0
        );


    const massaTotal =
        lista
        .filter(
            x => x.unidade === "ton"
        )
        .reduce(
            (total,x) =>
                total + x.quantidade,
            0
        );


    const areaTotal =
        lista
        .filter(
            x => x.unidade === "m²"
        )
        .reduce(
            (total,x) =>
                total + x.quantidade,
            0
        );


    const volumeTotal =
        lista
        .filter(
            x => x.unidade === "m³"
        )
        .reduce(
            (total,x) =>
                total + x.quantidade,
            0
        );


    texto +=

`RESUMO DO DIA

Comprimento total: ${numero(comprimentoTotal)} m`;


    if(massaTotal > 0){

        texto +=

`\nMassa Aplicada Total: ${numero(massaTotal)} ton`;

    }


    if(areaTotal > 0){

        texto +=

`\nÁrea Total: ${numero(areaTotal)} m²`;

    }


    if(volumeTotal > 0){

        texto +=

`\nVolume Total: ${numero(volumeTotal)} m³`;

    }


    return texto;

}


/* =====================================================
   GERAR RELATÓRIO
===================================================== */

function gerarRelatorio(){

    const dataSelecionada =
        document.getElementById(
            "dataRelatorio"
        ).value;


    const lista =
        obterApontamentos()
        .filter(
            x =>
                x.data ===
                dataSelecionada
        );


    textoRelatorio =
        montarRelatorio(lista);


    document.getElementById(
        "relatorioPreview"
    ).innerText =
        textoRelatorio;

}


/* =====================================================
   COPIAR
===================================================== */

function copiarRelatorio(){

    navigator.clipboard
        .writeText(textoRelatorio)
        .then(
            () =>
                alert(
                    "Relatório copiado! ✅"
                )
        );

}


/* =====================================================
   WHATSAPP
===================================================== */

function enviarWhatsApp(){

    const url =
        "https://wa.me/?text="
        +
        encodeURIComponent(
            textoRelatorio
        );


    window.open(
        url,
        "_blank"
    );

}


/* =====================================================
   RELATÓRIO DE HOJE
===================================================== */

function relatorioHoje(){

    document.getElementById(
        "dataRelatorio"
    ).value =
        hoje();


    gerarRelatorio();

}


/* =====================================================
   ABRIR RELATÓRIO DO DIA
===================================================== */

function abrirRelatorioDoDia(){

    document.getElementById(
        "dataRelatorio"
    ).value =
        document.getElementById(
            "data"
        ).value;


    mostrarPagina(
        "relatorio"
    );


    gerarRelatorio();

}


/* =====================================================
   HISTÓRICO
===================================================== */

function mostrarHistorico(){

    const filtro =
        document.getElementById(
            "filtroHistorico"
        ).value;


    let lista =
        obterApontamentos()
        .sort(
            (a,b) =>
                b.id - a.id
        );


    if(filtro){

        lista =
            lista.filter(
                x =>
                    x.data === filtro
            );

    }


    const container =
        document.getElementById(
            "listaHistorico"
        );


    if(lista.length === 0){

        container.innerHTML =

        `<div class="card">
            Nenhum apontamento encontrado.
        </div>`;

        return;

    }


    const grupos = {};


    lista.forEach(
        x => {

            if(!grupos[x.data]){

                grupos[x.data] = [];

            }

            grupos[x.data].push(x);

        }
    );


    container.innerHTML =

        Object.entries(grupos)
        .map(
            ([data,items]) => `

            <div class="card">

                <h3>
                    ${dataBR(data)}
                    —
                    ${items.length}
                    apontamento(s)
                </h3>


                ${

                    items.map(
                        (x,index) => `

                        <div class="entry">

                            <div class="entry-title">

                                ${String(index+1).padStart(2,"0")}
                                —
                                ${x.tipo}
                                —
                                ${x.faixa}

                                ${
                                    x.camada
                                    ?
                                    " — " + x.camada
                                    :
                                    ""
                                }

                            </div>


                            <span class="tag">
                                Sentido: ${x.sentido}
                            </span>


                            <div>
                                KM
                                ${x.kmInicial}
                                →
                                ${x.kmFinal}
                            </div>


                            <div>
                                Comprimento:
                                ${numero(x.comprimento)}
                                m
                            </div>


                            <div>
                                Resultado:
                                <b>
                                ${numero(x.quantidade)}
                                ${x.unidade}
                                </b>
                            </div>


                            <button
                                class="button gray"
                                onclick="editarApontamento(${x.id})"
                            >
                                ✏️ Editar
                            </button>


                            <button
                                class="button red"
                                onclick="excluirApontamento(${x.id})"
                            >
                                🗑️ Excluir
                            </button>

                        </div>

                        `
                    ).join("")

                }


                <button
                    class="button dark"
                    onclick="
                        document.getElementById('dataRelatorio').value='${data}';
                        mostrarPagina('relatorio');
                        gerarRelatorio();
                    "
                >
                    📋 Ver relatório do dia
                </button>

            </div>

            `
        )
        .join("");

}


/* =====================================================
   LIMPAR FILTRO
===================================================== */

function limparFiltroHistorico(){

    document.getElementById(
        "filtroHistorico"
    ).value = "";

    mostrarHistorico();

}


/* =====================================================
   PÁGINAS
===================================================== */

function mostrarPagina(pagina){

    document
        .getElementById("paginaNovo")
        .classList.add("hidden");


    document
        .getElementById("paginaHistorico")
        .classList.add("hidden");


    document
        .getElementById("paginaRelatorio")
        .classList.add("hidden");


    document
        .getElementById("navNovo")
        .classList.remove("active");


    document
        .getElementById("navHistorico")
        .classList.remove("active");


    document
        .getElementById("navRelatorio")
        .classList.remove("active");


    if(pagina === "novo"){

        document
            .getElementById("paginaNovo")
            .classList.remove("hidden");


        document
            .getElementById("navNovo")
            .classList.add("active");


        mostrarApontamentosHoje();

    }


    if(pagina === "historico"){

        document
            .getElementById("paginaHistorico")
            .classList.remove("hidden");


        document
            .getElementById("navHistorico")
            .classList.add("active");


        mostrarHistorico();

    }


    if(pagina === "relatorio"){

        document
            .getElementById("paginaRelatorio")
            .classList.remove("hidden");


        document
            .getElementById("navRelatorio")
            .classList.add("active");


        gerarRelatorio();

    }


    window.scrollTo(
        0,
        0
    );

}

   INICIALIZAÇÃO
===================================================== */

document.getElementById(
    "data"
).value =
    hoje();


document.getElementById(
    "dataRelatorio"
).value =
    hoje();


alterarTipo();

alterarFaixa();

mostrarApontamentosHoje();

gerarRelatorio();

</script>
