<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APONTAMENTOS DE OBRAS</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f3f4f6;
    color:#1f2937;
}

header{
    background:linear-gradient(135deg,#111827,#374151);
    color:white;
    padding:24px 15px;
    text-align:center;
    box-shadow:0 3px 12px #0002;
}

header h1{
    font-size:28px;
}

header p{
    margin-top:6px;
    opacity:.8;
}

nav{
    background:white;
    display:flex;
    justify-content:center;
    gap:10px;
    padding:12px;
    box-shadow:0 2px 8px #0001;
    position:sticky;
    top:0;
    z-index:10;
    flex-wrap:wrap;
}

nav button{
    border:0;
    background:#e5e7eb;
    padding:11px 17px;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
}

nav button:hover{
    background:#d1d5db;
}

nav button.ativo{
    background:#111827;
    color:white;
}

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}

.pagina{
    display:none;
}

.pagina.ativa{
    display:block;
}

.card{
    background:white;
    border-radius:15px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 3px 12px #00000012;
}

.card h2{
    margin-bottom:18px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.campo{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.campo label{
    font-weight:bold;
    font-size:14px;
}

input,
select,
textarea{
    width:100%;
    padding:11px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#374151;
}

input[readonly]{
    background:#e5e7eb;
    color:#374151;
    cursor:not-allowed;
}

textarea{
    min-height:90px;
    resize:vertical;
}

button{
    border:0;
    border-radius:9px;
    padding:11px 16px;
    cursor:pointer;
    font-weight:bold;
}

.btn{
    background:#111827;
    color:white;
}

.btn:hover{
    background:#374151;
}

.btn-verde{
    background:#16a34a;
    color:white;
}

.btn-azul{
    background:#2563eb;
    color:white;
}

.btn-vermelho{
    background:#dc2626;
    color:white;
}

.btn-amarelo{
    background:#f59e0b;
    color:white;
}

.botoes{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:18px;
}

.resultado{
    background:#f3f4f6;
    padding:18px;
    border-radius:10px;
    margin-top:18px;
}

.resultado strong{
    font-size:20px;
}

.lista{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.item{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:17px;
    background:#fafafa;
}

.item h3{
    margin-bottom:10px;
}

.item p{
    margin:5px 0;
}

.item .acoes{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:12px;
}

.badge{
    display:inline-block;
    background:#e5e7eb;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    margin:2px;
}

.resumo-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

.resumo{
    background:#f3f4f6;
    padding:18px;
    border-radius:12px;
}

.resumo span{
    display:block;
    font-size:13px;
    color:#6b7280;
}
